<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="{{ url_for('static', filename='img/icon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='style_editing.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_All.css') }}">

    <style>
        body {
            background-color: {
                    {
                    settings[1]
                }
            }

            ;
        }

            {
            % if settings[0] !="default" %
        }

        body {
            background-image: url("{{ url_for('static', filename=settings[0]) }}");
        }

            {
            % endif %
        }
    </style>

    <title>تعديل المذكرة</title>

</head>


<body>


    <!-- المظهر -->

    <div class="settings-card">

        <a href="{{ url_for('settings_edit') }}">
            ⚙️ المظهر
        </a>

    </div>


    <!-- العنوان -->

    <header>

        <h1>
            ✏️ تعديل المذكرة
        </h1>

    </header>


    <!-- التواريخ -->

    <div class="date-card">

        <small>
            📅 تاريخ الإنشاء: {{ note[4] }}
        </small>

        <br>

        <small>
            ✏️ آخر تعديل: {{ note[5] }}
        </small>

    </div>


    <!-- نموذج التعديل -->

    <form action="{{ url_for('save_edit_page') }}" method="post" class="edit-form">

        <input type="hidden" name="id" value="{{ note[0] }}">


        <label for="title">
            عنوان المذكرة
        </label>

        <input id="title" type="text" name="top" value="{{ note[1] }}">


        <label for="content">
            محتوى المذكرة
        </label>

        <textarea id="content" name="int">{{ note[2] }}</textarea>


        <label for="note-type">
            نوع المذكرة
        </label>

        <select id="note-type" name="note_type">

            <optgroup label="نوع المذكرة">

                <option value="temporary" class="temporary-option" {% if note[3]=="temporary" %}selected{% endif %}>
                    مذكرة مؤقتة 1
                </option>


                <option value="permanent" class="permanent-option" {% if note[3]=="permanent" %}selected{% endif %}>
                    مذكرة دائمة 2
                </option>


                <option value="long" class="long-option" {% if note[3]=="long" %}selected{% endif %}>
                    مذكرة بها أسطر كثيرة 3
                </option>

            </optgroup>

        </select>


        <button type="submit">
            💾 حفظ التعديل
        </button>


        <a href="{{ url_for('note_page', note_id=note[0]) }}" class="cancel-button">
            ↩️ إلغاء
        </a>

    </form>


</body>

</html>
